<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Operation Bosphorus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: Iznik ceramics. Sticky bar with a kilim band, Iznik star tile, a nazar bead mark and a
   skyline of domes and minarets under a crescent. Section names carry their Turkish name.
   Palette: lapis night / porcelain day, Iznik cobalt, Iznik red (primary), turquoise, Ottoman gold. */
:root{
  --bg:#08112b; --panel:#0e1a3d; --panel-2:#14224b; --line:#243569;
  --ink:#f4efe4; --muted:#a3acc6;
  --tile:#3a6cf0;      /* Iznik cobalt */
  --turq:#2fbcae;      /* Iznik turquoise: links, info */
  --coral:#e8473b;     /* Iznik red: primary action, stamps */
  --gold:#e0ac45;      /* Ottoman gold: points, wedding */
  --sky:#22397a;       /* skyline silhouette */
  --ok:#4cc38a; --warn:#e2ad4a;
  --on-accent:#ffffff;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f1f4fa; --panel:#ffffff; --panel-2:#f5f7fc; --line:#d2daea;
  --ink:#0b1940; --muted:#53607d; --tile:#1b4bb5; --turq:#0b7a70; --coral:#b8291f; --gold:#8a5f05; --sky:#c5d0ea;
  --ok:#1d8a55; --warn:#8c5c00; --on-accent:#ffffff; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f1f4fa; --panel:#ffffff; --panel-2:#f5f7fc; --line:#d2daea;
  --ink:#0b1940; --muted:#53607d; --tile:#1b4bb5; --turq:#0b7a70; --coral:#b8291f; --gold:#8a5f05; --sky:#c5d0ea;
  --ok:#1d8a55; --warn:#8c5c00; --on-accent:#ffffff; color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--turq)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;line-height:1.02;text-wrap:balance;margin:0}
h2{font-size:clamp(30px,6vw,44px);text-transform:uppercase}
h3{font-size:22px;text-transform:uppercase;letter-spacing:.02em}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:700 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* command bar */
.bar::after{content:"";display:block;height:7px;background:var(--kilim) 0 0/28px 7px repeat-x}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font:900 20px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{display:inline-block;width:20px;height:20px;border-radius:50%;flex:none;
  background:radial-gradient(circle,#0b0f1a 0 17%,#7fc6f0 18% 33%,#ffffff 34% 52%,#1d4fc4 53% 100%);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.me-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;white-space:nowrap}
.me-chip .av{width:26px;height:26px;font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--muted);font:700 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:10px 12px 12px;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--coral)}

main{padding-block:28px 80px}
section.view{display:grid;gap:28px}
.head{display:grid;gap:8px}
.head p{max-width:62ch;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>h3+*{margin-top:12px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:var(--on-accent)}
.btn.danger{color:var(--coral)}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--turq);cursor:pointer;font-weight:600;font-size:13px}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;color:var(--ink);font-size:15px}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font:700 11px/1.6 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;white-space:nowrap}
.pill.party{color:var(--coral)} .pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.turq{color:var(--turq)}
.pts{font:800 18px/1 var(--f-display);color:var(--gold);white-space:nowrap}

/* avatars */
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 18px/1 var(--f-display);color:var(--on-accent);background:var(--turq);overflow:hidden;text-transform:uppercase}
.av img{width:100%;height:100%;object-fit:cover}
.av.c1{background:var(--coral)} .av.c2{background:var(--tile);color:#fff} .av.c3{background:var(--gold)} .av.c4{background:var(--ok)}
.avs{display:flex}.avs .av{width:24px;height:24px;font-size:11px;border:2px solid var(--panel);margin-left:-6px}.avs .av:first-child{margin-left:0}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:clamp(22px,5vw,44px)}
.hero::before{content:"";position:absolute;inset:0;background:var(--tile);opacity:.17;-webkit-mask:var(--star) 0 0/56px 56px repeat;mask:var(--star) 0 0/56px 56px repeat;pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,var(--panel) 35%,transparent 100%);pointer-events:none}
.hero>*{position:relative;z-index:2}
.hero{padding-bottom:clamp(90px,14vw,150px)}
.hero>canvas.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:clamp(80px,13vw,140px);z-index:1;pointer-events:none}
/* Map tab */
.map-box{position:relative;z-index:0;isolation:isolate;height:min(68vh,620px);min-height:340px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--panel-2)}
@media (max-width:560px){.map-box{height:56vh}}
.map-box .leaflet-control-attribution{font-size:10px}
.map-box.dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6)}
.map-pin{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 12px/1 var(--f-mono);color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.map-pin.base{width:30px;height:30px;border-radius:6px;background:var(--coral);font-size:14px}
.map-list{display:grid;gap:6px}
.map-item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.map-item .map-pin{width:22px;height:22px;font-size:11px}
.leaflet-popup-content{font:14px/1.45 var(--f-body)}
.leaflet-popup-content b{font-family:var(--f-display);font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.hero h1{font-size:clamp(52px,12vw,112px);text-transform:uppercase;font-weight:900;letter-spacing:-.005em;margin-top:10px}
.hero .sub{font-size:clamp(16px,2.4vw,19px);max-width:46ch;margin-top:10px}
.stamp{display:inline-block;font:700 12px/1 var(--f-mono);letter-spacing:.2em;color:var(--coral);border:2px solid var(--coral);padding:6px 10px;transform:rotate(-2deg);text-transform:uppercase}
.countdown{display:flex;gap:clamp(10px,3vw,26px);margin-top:26px;flex-wrap:wrap}
.cd{display:grid;gap:4px}
.cd b{font:800 clamp(40px,9vw,72px)/.9 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.cd span{font:700 11px/1 var(--f-mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.cds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:26px}
.cd-block{border:1px solid var(--line);border-radius:var(--r);background:color-mix(in srgb,var(--panel) 86%,transparent);padding:20px 22px;min-width:0;display:grid;gap:4px;align-content:start}
.cd-block.wed{border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.cd-label{font:600 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cd-title{font:900 clamp(30px,6.5vw,44px)/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;color:var(--coral)}
.cd-block.wed .cd-title{color:var(--gold)}
.cd-block .countdown{display:grid;grid-template-columns:repeat(3,minmax(0,max-content));gap:0 clamp(22px,5vw,36px);margin-top:14px}
.cd-block .cd{gap:6px}
.cd-block .cd b{font-size:clamp(32px,6vw,48px);font-weight:800}
.cd-block .cd span{font-size:10px;letter-spacing:.14em}
.cd-sub{margin-top:12px;font-size:13px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts>div{background:var(--panel);padding:14px 16px;min-width:0}
.facts dt{font:700 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:6px 0 0;font-weight:600}

/* crew */
.crew-card{display:grid;gap:14px;align-content:start}
.crew-top{display:flex;gap:14px;align-items:center}
.crew-top .av{width:72px;height:72px;font-size:30px}
.crew-name{font:800 30px/1 var(--f-display);text-transform:uppercase}
.nick{color:var(--turq);font:700 13px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.nights{display:flex;gap:4px}
.nights i{width:100%;max-width:26px;height:8px;border-radius:2px;background:var(--line)}
.nights i.on{background:var(--turq)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--panel-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{margin-top:3px;accent-color:var(--turq);width:17px;height:17px;flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px}

/* itinerary */
.daypick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.daypick button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;cursor:pointer;display:grid;gap:2px;text-align:center;min-width:62px;color:var(--ink)}
.daypick button b{font:800 22px/1 var(--f-display)}
.daypick button span{font:700 10px/1 var(--f-mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.daypick button[aria-pressed="true"]{border-color:var(--turq);background:color-mix(in srgb,var(--turq) 14%,var(--panel))}
.daypick button.today span{color:var(--coral)}
.timeline{display:grid}
.tl{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl:last-child{border-bottom:0}
.tl time{font:700 13px/1.5 var(--f-mono);color:var(--turq)}
.tl .what{display:grid;gap:4px;min-width:0}
.changed{font-size:12.5px;color:var(--gold)}
.wear{background:var(--panel-2);border-radius:8px;padding:12px 14px;font-size:14px}
.wear b{font:700 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}

/* challenges */
.ch{display:grid;grid-template-columns:1fr auto;gap:10px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.ch:last-child{border-bottom:0}
.ch .t{font-weight:700}
.ch .d{font-size:14px;color:var(--muted)}
.ch .side{display:grid;gap:8px;justify-items:end}
.ch .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;grid-column:1/-1}

/* vault */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,170px),1fr));gap:8px}
.shot{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);cursor:pointer;padding:0}
.shot img,.shot video{width:100%;height:100%;object-fit:cover;display:block}
.shot .cap{position:absolute;inset:auto 0 0 0;padding:18px 8px 6px;font-size:12px;text-align:left;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.shot .play{position:absolute;top:6px;right:6px;font:700 10px/1 var(--f-mono);background:rgba(0,0,0,.6);color:#fff;padding:4px 6px;border-radius:4px}
.jokes{display:grid;gap:10px}
.joke{background:var(--panel-2);border-radius:8px;padding:12px 14px;display:grid;gap:6px}
.joke q{font-size:16px;font-weight:600;quotes:"“" "”"}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}

/* polls */
.poll{display:grid;gap:12px}
.opt{position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:10px 12px;cursor:pointer;overflow:hidden;color:var(--ink)}
.opt .fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--turq) 22%,transparent);transition:width .5s ease}
.opt>*:not(.fill){position:relative}
.opt.mine{border-color:var(--turq)}
.opt.lead .n{color:var(--turq)}
.opt .n{font:700 13px/1 var(--f-mono)}
.opt[disabled]{cursor:default}

/* leaderboard */
.lb{display:grid;gap:8px}
.lb-row{display:grid;grid-template-columns:34px 44px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.lb-row .rank{font:900 30px/1 var(--f-display);color:var(--muted);text-align:center}
.lb-row.first{border-color:var(--gold)}
.lb-row.first .rank{color:var(--gold)}
.lb-row.last{border-style:dashed;border-color:var(--coral)}
.bar-track{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--gold);border-radius:3px}
.breakdown{font-size:12px;color:var(--muted)}
.award{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;justify-items:center}
.award .medal{width:40px;height:40px;background:var(--gold);-webkit-mask:var(--star) center/contain no-repeat;mask:var(--star) center/contain no-repeat}
.award b{font:800 20px/1.05 var(--f-display);text-transform:uppercase}
.award.locked{color:var(--muted)}
.award.locked .medal{background:var(--line)}

/* banner, toast, dialog */
.banner{border-radius:8px;padding:10px 14px;font-size:14px;border:1px solid var(--line);background:var(--panel-2)}
#banner{margin:0 0 20px}
.banner.warn{border-color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:0;width:min(520px,calc(100% - 32px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(3,6,14,.7)}
.dlg{padding:20px;display:grid;gap:14px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.who-grid button{display:grid;gap:6px;justify-items:center;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:12px 6px;cursor:pointer;font-weight:700;color:var(--ink)}
.who-grid button[aria-pressed="true"]{border-color:var(--turq)}
.lightbox{width:min(980px,calc(100% - 16px))}
.lightbox img,.lightbox video{width:100%;max-height:72vh;object-fit:contain;background:#000;display:block}
@media (max-width:560px){
  .tl{grid-template-columns:1fr;gap:4px}
  .lb-row{grid-template-columns:26px 36px 1fr auto;gap:8px}
  .lb-row .av{width:36px;height:36px}
  .disp{grid-template-columns:52px 1fr}
  .status .label{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pw-wrap{position:relative;display:block}
.pw-wrap input{padding-right:64px!important}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%)}
.gate{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:20px;align-items:start;margin-top:2vh}
.gate .hero h1{font-size:clamp(48px,9vw,96px)}
.gate-side{display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.gate-side h3{font-size:20px}
.gate-facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

};

function avatar(key, cls = "") {
  const c = crewBy(key); if (!c) return `<span class="av ${cls}">?</span>`;
  const prof = D.crew.find(x => x.id === key) || {};
  const i = crewIdx(key);
  // An uploaded profile photo wins; otherwise the default photo shipped with the site (public/crew/).
  const src = mediaSrc(prof.photo ? {url: prof.photo} : prof.photoPath ? {path: prof.photoPath} : null) || c.photo || "";
  const inner = src ? `<img src="${h(src)}" alt="">` : h(c.name[0]);
  return `<span class="av c${i} ${cls}" title="${h(c.name)}">${inner}</span>`;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200);
}
function errMsg(e) {
  const code = e && (e.code || e.statusCode);
  if (code === "42501" || code === "403" || code === 403) return "You're not allowed to change that. Only the organizer can, or your email isn't on the crew list.";
  if (code === "quota_exceeded") return "This browser is out of storage space. Delete a few uploads and try again.";
  if (code === "413" || code === 413) return "That file is too big. Keep uploads under 50 MB.";
  return (e && e.message) || "That didn't save. Check your connection and try again.";
}

/* ============================================================
   STORE — Supabase (shared, signed-in crew) or this-browser fallback
   Data model: one table `docs(coll, id, data jsonb)`; see supabase/schema.sql
   ============================================================ */
const COLLS = ["crew","challenges","completions","polls","votes","vault","jokes","adjust","bookings","secrets","settings"];
const D = {}; COLLS.forEach(c => D[c] = []);
const CFG = window.BP_CONFIG || {};
const SB = (CFG.supabaseUrl && CFG.supabaseAnonKey && !/YOUR_/.test(CFG.supabaseUrl) && window.supabase)
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey) : null;
const BUCKET = "vault";
// No sign-in: whoever picks the organizer's name gets the organizer tools (sealed messages, unseal awards).
const isOrganizer = () => !!ME && ME === (CFG.organizer || "");
const MAX_UPLOAD = 50 * 1024 * 1024;

const Store = {
  mode: "connecting", owner: false, member: null, channel: null,
  async init() {
    if (!SB) {
      this.mode = "local";
      COLLS.forEach(name => D[name] = this.localAll(name));
      showBanner("Preview mode: Supabase isn't configured, so everything is saved in this browser only. See README to connect it.");
      changed(); paintStatus(); return true;
    }
    this.mode = "live";
    this.owner = isOrganizer();
    await this.loadAll();
    this.subscribe();
    paintStatus(); return true;
  },
  async loadAll() {
    const next = {}; COLLS.forEach(c => next[c] = []);
    for (let from = 0; ; from += 1000) {
      const {data, error} = await SB.from("docs").select("coll,id,data").range(from, from + 999);
      if (error) { showBanner("Couldn't load shared data. Check your connection; it retries when you reload.", "warn"); return; }
      data.forEach(r => { if (next[r.coll]) next[r.coll].push({id: r.id, ...r.data}); });
      if (data.length < 1000) break;
    }
    COLLS.forEach(c => D[c] = next[c]); hideBanner(); changed();
  },
  subscribe() {
    let dropped = false;
    this.channel = SB.channel("docs-live")
      .on("postgres_changes", {event: "*", schema: "public", table: "docs"}, ev => {
        const row = ev.eventType === "DELETE" ? ev.old : ev.new;
        if (!row || !D[row.coll]) return;
        const list = D[row.coll].filter(x => x.id !== row.id);
        if (ev.eventType !== "DELETE") list.push({id: row.id, ...row.data});
        D[row.coll] = list; changed();
      })
      .subscribe(status => {
        if (status === "SUBSCRIBED") { if (dropped) { dropped = false; this.loadAll(); } hideBanner(); paintStatus(true); }
        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") { dropped = true; paintStatus(false); showBanner("Live updates paused. Reconnecting…", "warn"); }
      });
  },
  localAll(name) { const o = LS.get("bp:db:" + name, {}); return Object.entries(o).map(([id, v]) => ({id, ...v})); },
  localWrite(name, fn) {
    const o = LS.get("bp:db:" + name, {}); fn(o);
    if (!LS.set("bp:db:" + name, o)) throw {code: "quota_exceeded"};
    D[name] = this.localAll(name); changed();
  },
  async put(name, id, data) {
    if (this.mode !== "live") return this.localWrite(name, o => { o[id] = data; });
    const {error} = await SB.from("docs").upsert({coll: name, id, data, updated_by: ME});
    if (error) throw error;
    // Apply locally right away; the realtime echo is idempotent.
    D[name] = [...D[name].filter(x => x.id !== id), {id, ...data}]; changed();
  },
  async del(name, id) {
    if (this.mode !== "live") return this.localWrite(name, o => { delete o[id]; });
    const doc = D[name].find(x => x.id === id);
    const {error} = await SB.from("docs").delete().eq("coll", name).eq("id", id);
    if (error) throw error;
    D[name] = D[name].filter(x => x.id !== id); changed();
    if (doc && doc.path) SB.storage.from(BUCKET).remove([doc.path]).catch(() => {});
  },
  canUpload() { return true; },
  async upload(file) {
    const isVideo = file.type.startsWith("video/");
    if (this.mode === "live") {
      const blob = isVideo ? file : await shrink(file, 1800, .84).catch(() => file);
      if (blob.size > MAX_UPLOAD) throw {message: "That file is over 50 MB. Trim the video or pick a shorter clip."};
      const ext = isVideo ? (file.name.split(".").pop() || "mp4").toLowerCase().replace(/[^a-z0-9]/g, "") : "jpg";
      const path = `${ME}/${uid()}.${ext}`;
      const {error} = await SB.storage.from(BUCKET).upload(path, blob, {contentType: isVideo ? file.type : "image/jpeg", upsert: false});
      if (error) throw error;
      return {path, kind: isVideo ? "video" : "image"};
    }
    if (isVideo) throw {message: "Videos need the live site. Preview mode keeps photos only."};
    const small = await shrink(file, 900, .72);
    return {url: await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(small); }), kind: "image"};
  },
};

/* Private bucket: files are shown through signed links, fetched in batches and cached. */
const SIGNED = new Map(); const PENDING = new Set(); let signTimer = 0;
const SIGN_TTL = 60 * 60 * 24 * 7;
function mediaSrc(o) {
  if (!o) return "";
  if (o.url) return o.url;
  const path = o.path || o.photoPath;
  if (!path || !SB) return "";
  const hit = SIGNED.get(path);
  if (hit && hit.exp > Date.now()) return hit.url;
  PENDING.add(path);
  clearTimeout(signTimer); signTimer = setTimeout(signPending, 30);
  return "";
}
async function signPending() {
  const paths = [...PENDING]; PENDING.clear(); if (!paths.length) return;
  const {data, error} = await SB.storage.from(BUCKET).createSignedUrls(paths, SIGN_TTL);
  if (error || !data) return;
  const by = new Map(data.map(d => [d.path, d]));
  // Cache misses too (deleted file), so a broken path can't trigger a render loop.
  paths.forEach(p => { const d = by.get(p); SIGNED.set(p, d && d.signedUrl ? {url: d.signedUrl, exp: Date.now() + (SIGN_TTL - 3600) * 1000} : {url: "", exp: Date.now() + 300000}); });
  changed();
}

function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b => b ? res(b) : rej(new Error("Couldn't read that photo.")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("This browser can't read that photo format. Try a JPEG or PNG.")); };
    img.src = url;
  });
}

function allChallenges() {
  const custom = D.challenges.map(c => ({id: c.id, cat: "Crew-made", day: null, pts: Number(c.pts) || 10, t: c.t, d: c.d || "", by: c.by}));

function scores() {
  const chs = Object.fromEntries(allChallenges().map(c => [c.id, c]));
  const s = Object.fromEntries(CREW.map(c => [c.key, {key: c.key, total: 0, ch: 0, chCount: 0, drops: 0, bonus: 0, photos: 0, votes: 0}]));
  D.completions.forEach(x => { const c = chs[x.ch]; if (c && s[x.crew]) { s[x.crew].ch += c.pts; s[x.crew].chCount++; } });
  const dropDays = {};
  D.vault.forEach(v => { if (!s[v.by]) return; s[v.by].photos++; if (v.day >= 1 && v.day <= 9) (dropDays[v.by] ||= new Set()).add(v.day); });
  Object.entries(dropDays).forEach(([k, set]) => s[k].drops = set.size * DAILY_DROP_PTS);
  D.adjust.forEach(a => { if (s[a.crew]) s[a.crew].bonus += Number(a.pts) || 0; });
  D.votes.forEach(v => { if (s[v.crew]) s[v.crew].votes++; });
  Object.values(s).forEach(r => r.total = r.ch + r.drops + r.bonus);
  return Object.values(s).sort((a, b) => b.total - a.total || a.key.localeCompare(b.key));
}

function drawSkylines() {
  const css = getComputedStyle(document.documentElement);
  const sky = css.getPropertyValue("--sky").trim() || "#16264a";
  const moon = css.getPropertyValue("--gold").trim() || "#e2ad4a";
  $$("canvas.skyline").forEach(cv => {
    const w = cv.clientWidth, hgt = cv.clientHeight; if (!w || !hgt) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = w * dpr; cv.height = hgt * dpr;
    const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, hgt);
    const base = hgt - 6, u = hgt / 100;
    // crescent moon (cut a circle out of a circle)
    const mx = w * .86, my = hgt * .22, mr = 11 * u;
    c.fillStyle = moon; c.beginPath(); c.arc(mx, my, mr, 0, Math.PI * 2); c.fill();
    c.globalCompositeOperation = "destination-out"; c.beginPath(); c.arc(mx + mr * .38, my - mr * .12, mr * .84, 0, Math.PI * 2); c.fill();
    c.globalCompositeOperation = "source-over";
    c.fillStyle = sky;
    const rect = (x, y, ww, hh) => c.fillRect(x, y, ww, hh);
    const dome = (x, r, lift = 0) => { c.beginPath(); c.ellipse(x, base - lift, r, r * .92, 0, Math.PI, 0); c.fill(); };
    const minaret = (x, hh) => { const mw = 2.6 * u; rect(x - mw / 2, base - hh, mw, hh); rect(x - mw, base - hh * .72, mw * 2, 1.8 * u);
      c.beginPath(); c.moveTo(x - mw / 2, base - hh); c.lineTo(x, base - hh - 14 * u); c.lineTo(x + mw / 2, base - hh); c.fill(); };
    const mosque = (x, s) => { rect(x - 34 * s * u, base - 16 * s * u, 68 * s * u, 16 * s * u);
      dome(x - 20 * s * u, 10 * s * u, 16 * s * u); dome(x + 20 * s * u, 10 * s * u, 16 * s * u); dome(x, 22 * s * u, 18 * s * u);
      rect(x - 1, base - 52 * s * u, 2, 12 * s * u);
      [-44, 44].forEach(dx => minaret(x + dx * s * u, 62 * s * u)); };
    const galata = x => { rect(x - 6 * u, base - 58 * u, 12 * u, 58 * u); rect(x - 8 * u, base - 62 * u, 16 * u, 5 * u);
      c.beginPath(); c.moveTo(x - 8 * u, base - 62 * u); c.lineTo(x, base - 86 * u); c.lineTo(x + 8 * u, base - 62 * u); c.fill(); };
    // waterline and low city
    rect(0, base, w, hgt - base);
    for (let x = 0; x < w; x += 18 * u) rect(x, base - (6 + ((x * 7) % 11)) * u, 16 * u, (6 + ((x * 7) % 11)) * u);
    const scale = Math.min(1.25, Math.max(.7, w / 900));
    mosque(w * .2, scale); mosque(w * .48, scale * .82); galata(w * .68);
    [w * .06, w * .34, w * .6].forEach(x => minaret(x, 44 * u));
    // Bosphorus bridge on the right
    const bx = w * .78, bw = w * .2; c.strokeStyle = sky; c.lineWidth = Math.max(1, u * .9);
    rect(bx, base - 40 * u, 2.4 * u, 40 * u); rect(bx + bw, base - 40 * u, 2.4 * u, 40 * u); rect(bx - 10 * u, base - 14 * u, bw + 22 * u, 2.4 * u);
    c.beginPath(); c.moveTo(bx, base - 40 * u); c.quadraticCurveTo(bx + bw / 2, base - 4 * u, bx + bw, base - 40 * u); c.stroke();
  });
}

/* ---------- THE MAP ---------- */
let mapDay = "all", leafletMap = null, mapLayer = null, mapMarkers = [];
function loadLeaflet() {
  return window.L ? Promise.resolve(window.L) : Promise.reject(new Error("The map library didn't load."));
}
function mapStops() {
  const out = [];
  DAYS.forEach(d => d.items.forEach(([time, plan, q]) => {
    if (q && PLACES[q] && !(q === "Istanbul Airport" && out.some(o => o.q === q && o.day === d.n))) out.push({day: d.n, label: d.label, time, plan, q, ll: PLACES[q]});
  }));
  return out;
}
const isDark = () => getComputedStyle(document.documentElement).colorScheme.includes("dark");
VIEWS.map = {
  shell() {
    return `<section class="view">
      <div class="head"><div class="eyebrow"><span lang="tr">Harita</span> · Every stop</div><h2>The Map</h2>
      <p>Every stop from the itinerary, colored by day. Tap a pin for the plan and directions. Pins are approximate; Google Maps has the exact spot.</p></div>
      <div class="chips" id="map-days">${[["all", "All days"], ...DAYS.map(d => [String(d.n), `Day ${d.n} · ${d.dow}`])].map(([v, l]) =>
        `<button class="chip" type="button" data-md="${v}" aria-pressed="${mapDay === v}">${l}</button>`).join("")}</div>
      <div class="row"><button class="btn small" type="button" id="map-city">Istanbul</button><button class="btn small" type="button" id="map-all">Whole trip (Sapanca + Thrace)</button><button class="btn small" type="button" id="map-base">Base</button></div>
      <div class="map-box" id="map"><div class="empty" style="border:0;height:100%;display:grid;place-items:center">Loading map…</div></div>
      <div class="map-list" id="map-list"></div>
    </section>`;
  },
  async mount() {
    const token = this.token = (this.token || 0) + 1;
    $$("[data-md]").forEach(b => b.onclick = () => { mapDay = b.dataset.md; $$("[data-md]").forEach(x => x.setAttribute("aria-pressed", x === b)); this.draw(true); });
    try { await loadLeaflet(); } catch (e) { $("#map").innerHTML = `<div class="empty" style="border:0">${h(e.message)} Check your connection and reload.</div>`; return; }
    if (!$("#map") || token !== this.token) return; // navigated away or re-mounted while loading
    if (this.ro) { this.ro.disconnect(); this.ro = null; }
    if (leafletMap) { leafletMap.stop(); leafletMap.off(); leafletMap.remove(); leafletMap = null; }
    $("#map").innerHTML = "";
    leafletMap = L.map("map", {zoomControl: true, attributionControl: true, scrollWheelZoom: false}).setView([41.03, 28.99], 12);
    $("#map").classList.toggle("dark", isDark());
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, referrerPolicy: "strict-origin-when-cross-origin", // OSM requires a referrer
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
    }).addTo(leafletMap);
    mapLayer = L.layerGroup().addTo(leafletMap);
    $("#map-city").onclick = () => leafletMap.fitBounds([[40.98, 28.95], [41.08, 29.05]]);
    $("#map-all").onclick = () => this.fit(true);
    $("#map-base").onclick = () => leafletMap.setView(BASE_LATLNG, 15);
    this.draw(false);
    // Leaflet needs the box's real size, which phones only know after layout.
    // Fitting to a zero-size box zooms all the way in, so wait for a real size.
    const box = $("#map"), m = leafletMap; let fitted = false;
    const settle = () => {
      if (leafletMap !== m) return;
      m.invalidateSize();
      if (!fitted && box.clientWidth > 50 && box.clientHeight > 50) { fitted = true; this.fit(false, false); }
    };
    if (window.ResizeObserver) { this.ro = new ResizeObserver(settle); this.ro.observe(box); }
    requestAnimationFrame(settle); setTimeout(settle, 300); setTimeout(settle, 1000);
  },
  fit(all, animate = true) {
    const pts = (all ? mapStops() : mapMarkers.map(m => m.s)).map(s => s.ll).concat([BASE_LATLNG]);
    if (pts.length) leafletMap.fitBounds(pts, {padding: [30, 30], maxZoom: 15, animate});
  },
  draw(fit) {
    if (!leafletMap) return;
    mapLayer.clearLayers(); mapMarkers = [];
    const icon = (txt, color, cls = "") => L.divIcon({className: "", iconSize: [26, 26], iconAnchor: [13, 13],
      html: `<span class="map-pin ${cls}" style="${color ? "background:" + color : ""}">${txt}</span>`});
    L.marker(BASE_LATLNG, {icon: icon("★", "", "base"), zIndexOffset: 1000}).addTo(mapLayer)
      .bindPopup(`<b>Base · Airbnb</b><br>${h(BASE)}<br><a href="${mapUrl(BASE)}" target="_blank" rel="noopener">Directions ↗</a>`);
    const stops = mapStops().filter(s => mapDay === "all" || String(s.day) === mapDay);
    stops.forEach(s => {
      const m = L.marker(s.ll, {icon: icon(s.day, DAY_COLORS[s.day - 1])}).addTo(mapLayer)
        .bindPopup(`<b>Day ${s.day} · ${h(s.time)}</b><br>${h(s.plan)}<br><span style="opacity:.7">${h(s.label)}</span><br><a href="${mapUrl(s.q)}" target="_blank" rel="noopener">Open in Google Maps ↗</a>`);
      mapMarkers.push({m, s});
    });
    $("#map-list").innerHTML = stops.map((s, i) => `<button class="map-item" type="button" data-mi="${i}">
      <span class="map-pin" style="background:${DAY_COLORS[s.day - 1]}">${s.day}</span>
      <span style="min-width:0"><b>${h(s.plan)}</b><br><span class="muted" style="font-size:12px">${h(s.label)} · ${h(s.time)}</span></span>
      <span class="muted" style="font-size:12px">Show ↗</span></button>`).join("");
    $$("[data-mi]").forEach(b => b.onclick = () => { const {m} = mapMarkers[+b.dataset.mi]; leafletMap.setView(m.getLatLng(), 15); m.openPopup(); $("#map").scrollIntoView({behavior: "smooth", block: "center"}); });
    if (fit) this.fit(false);
  },
  update() {},
};

        <div class="side"><span class="pts">+${c.pts}</span>
          ${isComp ? `<button class="btn small" type="button" data-win="${h(c.id)}">${who.length ? "Change winner" : "Record winner"}</button>`
                   : mine ? `<button class="btn small" type="button" data-undo="${h(mine.id)}">Undo</button>` : `<button class="btn small primary" type="button" data-did="${h(c.id)}">I did it</button>`}</div>
        <div class="meta">${dayTag}<span class="pill">${h(c.cat)}</span>
          ${who.length ? `<span class="avs">${who.map(x => avatar(x.crew)).join("")}</span><span class="muted" style="font-size:12px">${isComp ? "Winner: " : "Done by "}${who.map(x => h(crewBy(x.crew)?.name)).join(", ")}</span>` : ""}
          ${who.length && !isComp ? `<button class="link" type="button" data-strike="${h(c.id)}">Strike a claim</button>` : ""}
          ${c.by && (c.by === ME || Store.owner) ? `<button class="link" type="button" data-rmdare="${h(c.id)}" style="color:var(--coral)">Remove dare</button>` : ""}</div></div>`;
    }).join("")) || `<div class="empty">No crew-made dares yet. Propose one below.</div>`;
    $$("[data-did]").forEach(b => b.onclick = () => { if (!needMe()) return; act(Store.put("completions", b.dataset.did + "__" + ME, {ch: b.dataset.did, crew: ME, at: Date.now()}), "Claimed. Points added."); });
    $$("[data-undo]").forEach(b => b.onclick = () => act(Store.del("completions", b.dataset.undo), "Claim removed"));
    $$("[data-win]").forEach(b => b.onclick = () => pickCrew("Who won?", async k => {
      for (const x of D.completions.filter(x => x.ch === b.dataset.win)) await Store.del("completions", x.id);
      if (k) await Store.put("completions", b.dataset.win + "__" + k, {ch: b.dataset.win, crew: k, at: Date.now()});
    }, true));
    $$("[data-strike]").forEach(b => b.onclick = () => pickCrew("Strike whose claim?", async k => Store.del("completions", b.dataset.strike + "__" + k), false, D.completions.filter(x => x.ch === b.dataset.strike).map(x => x.crew)));
    $$("[data-rmdare]").forEach(b => b.onclick = () => confirmBox("Remove this dare and its claims?", async () => {
      for (const x of D.completions.filter(x => x.ch === b.dataset.rmdare)) await Store.del("completions", x.id);
      await Store.del("challenges", b.dataset.rmdare);
    }));
  },
};
function pickCrew(title, fn, allowNone = false, only = null) {
  const list = CREW.filter(c => !only || only.includes(c.key));
  openDialog(`<div class="dlg"><h3>${h(title)}</h3>
    <div class="who-grid">${list.map(c => `<button type="button" data-pk="${c.key}">${avatar(c.key)}<span>${h(c.name)}</span></button>`).join("")}</div>
    <div class="row" style="justify-content:flex-end">${allowNone ? `<button class="btn" type="button" data-pk="">Clear</button>` : ""}<button class="btn" type="button" data-close>Cancel</button></div></div>`);
  $$("[data-pk]", $("#dlg")).forEach(b => b.onclick = async () => { closeDialog(); await act(fn(b.dataset.pk), "Saved"); });
}
function confirmBox(msg, fn) {
  openDialog(`<div class="dlg"><h3>Are you sure?</h3><p>${h(msg)}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-close>Cancel</button><button class="btn danger" type="button" id="cf-yes">Yes, remove</button></div></div>`);
  $("#cf-yes").onclick = async () => { closeDialog(); await act(fn(), "Removed"); };
}

/* ---------- THE VAULT ---------- */
let vaultDay = "all";
VIEWS.vault = {
  shell() {
    const today = tripDay();
    const def = today || (Date.now() < T_START ? 0 : 9);
    return `<section class="view">
      <div class="head"><div class="eyebrow"><span lang="tr">Kasa</span> · Evidence locker</div><h2>The Vault</h2>
      <p>Daily photos, videos and the inside jokes nobody outside this crew will understand. Your first upload each trip day earns ${DAILY_DROP_PTS} points.</p></div>
      <form class="panel stack" id="up-form"><h3>Drop evidence</h3>
                <div class="grid g2">
          <label class="f">Photo or video<input type="file" id="up-file" accept="image/*,video/*" multiple required></label>
          <label class="f">Day<select id="up-day"><option value="0">Pre-mission</option>${DAYS.map(d => `<option value="${d.n}" ${d.n === def ? "selected" : ""}>Day ${d.n} · ${h(d.label)}</option>`).join("")}</select></label>
        </div>
        <label class="f">Caption<input type="text" id="up-cap" maxlength="140" placeholder="What happened here?"></label>
        <div class="row"><button class="btn primary" type="submit" id="up-btn">Upload</button><span class="muted" style="font-size:13px">Photos are resized before upload. Videos up to 50 MB.</span></div>
      </form>
      <div class="chips" id="vault-days"></div>
      <div id="gallery"></div>
      <div class="grid g2">
        <form class="panel stack" id="joke-form"><h3>Inside jokes</h3>
          <label class="f">The line<input type="text" id="joke-t" maxlength="160" placeholder="Something that will make zero sense in a year" required></label>
          <label class="f">Context (optional)<input type="text" id="joke-c" maxlength="160" placeholder="Where, who, why"></label>
          <div><button class="btn primary" type="submit">Add to the wall</button></div></form>
        <div class="jokes" id="jokes"></div>
      </div>
    </section>`;
  },
  mount() {
    $("#up-form").onsubmit = async e => {
      e.preventDefault(); if (!needMe()) return;
      const files = [...$("#up-file").files]; if (!files.length) return;
      const btn = $("#up-btn"); btn.disabled = true;
      let n = 0;
      for (const f of files) {
        btn.textContent = `Uploading ${n + 1} of ${files.length}…`;
        try { const up = await Store.upload(f);
          await Store.put("vault", uid(), {...up, cap: $("#up-cap").value.trim(), day: +$("#up-day").value, by: ME, at: Date.now()}); n++;
        } catch (err) { toast(errMsg(err)); break; }
      }
      btn.disabled = false; btn.textContent = "Upload";
      if (n) { toast(`${n} upload${n > 1 ? "s" : ""} added to the Vault`); $("#up-file").value = ""; $("#up-cap").value = ""; }
    };
    $("#joke-form").onsubmit = e => { e.preventDefault(); if (!needMe()) return;
      const t = $("#joke-t").value.trim(); if (!t) return;
      act(Store.put("jokes", uid(), {t, c: $("#joke-c").value.trim(), by: ME, at: Date.now()}), "On the wall").then(ok => { if (ok) { $("#joke-t").value = ""; $("#joke-c").value = ""; } }); };
  },
  update() {
    const counts = {}; D.vault.forEach(v => counts[v.day] = (counts[v.day] || 0) + 1);
    const opts = [["all", "All", D.vault.length], ["0", "Pre", counts[0] || 0], ...DAYS.map(d => [String(d.n), "Day " + d.n, counts[d.n] || 0])];
    $("#vault-days").innerHTML = opts.map(([v, l, c]) => `<button class="chip" type="button" data-vd="${v}" aria-pressed="${vaultDay === v}">${l} <span class="mono">${c}</span></button>`).join("");
    $$("[data-vd]").forEach(b => b.onclick = () => { vaultDay = b.dataset.vd; this.update(); });
    const items = D.vault.filter(v => vaultDay === "all" || String(v.day) === vaultDay).sort((a, b) => b.at - a.at);
    $("#gallery").innerHTML = items.length ? `<div class="gallery">${items.map(v => `<button class="shot" type="button" data-shot="${h(v.id)}" aria-label="${h(v.cap || "Open upload")}">
        ${(() => { const s = mediaSrc(v); if (!s) return `<span class="ph">Loading…</span>`;
          return v.kind === "video" ? `<video src="${h(s)}#t=0.1" muted preload="metadata" playsinline></video><span class="play">VIDEO</span>` : `<img src="${h(s)}" alt="${h(v.cap || "")}" loading="lazy">`; })()}
        <span class="cap">${h(crewBy(v.by)?.name || "")}${v.cap ? " · " + h(v.cap) : ""}</span></button>`).join("")}</div>`
      : `<div class="empty">${vaultDay === "all" ? "The Vault is empty. The first photo of the trip earns the daily drop." : "Nothing filed for this day yet."}</div>`;
    $$("[data-shot]").forEach(b => b.onclick = () => openShot(b.dataset.shot));
    const jokes = [...D.jokes].sort((a, b) => b.at - a.at);
    $("#jokes").innerHTML = jokes.length ? jokes.map(j => `<div class="joke"><q>${h(j.t)}</q>${j.c ? `<span class="muted" style="font-size:13px">${h(j.c)}</span>` : ""}
      <div class="spread"><span class="row" style="gap:6px">${avatar(j.by, "")}<span class="muted" style="font-size:12px">${h(crewBy(j.by)?.name || "")}</span></span>
      ${j.by === ME || Store.owner ? `<button class="link" type="button" data-rmj="${h(j.id)}" style="color:var(--coral)">Remove</button>` : ""}</div></div>`).join("")
      : `<div class="empty">No inside jokes yet. Give it until the meyhane.</div>`;
    $$("#jokes .av").forEach(a => { a.style.width = "22px"; a.style.height = "22px"; a.style.fontSize = "11px"; });
    $$("[data-rmj]").forEach(b => b.onclick = () => confirmBox("Remove this joke from the wall?", () => Store.del("jokes", b.dataset.rmj)));
  },
};
function openShot(id) {
  const v = D.vault.find(x => x.id === id); if (!v) return;
  const canRm = v.by === ME || Store.owner;
  const s = mediaSrc(v);
  openDialog(`${v.kind === "video" ? `<video src="${h(s)}" controls playsinline></video>` : `<img src="${h(s)}" alt="${h(v.cap || "")}">`}
    <div class="dlg"><div class="spread"><div><b>${h(crewBy(v.by)?.name || "")}</b> <span class="muted">· ${v.day ? "Day " + v.day : "Pre-mission"} · ${h(fmtTime(v.at))}</span></div>
    <div class="row">${canRm ? `<button class="btn small danger" type="button" id="rm-shot">Delete</button>` : ""}<button class="btn small" type="button" data-close>Close</button></div></div>
    ${v.cap ? `<p>${h(v.cap)}</p>` : ""}</div>`, "lightbox");
  if (canRm) $("#rm-shot").onclick = () => confirmBox("Delete this upload for everyone?", () => Store.del("vault", id));
}

/* ---------- THE POLLS ---------- */
VIEWS.polls = {
  shell() {
    return `<section class="view">
      <div class="head"><div class="eyebrow"><span lang="tr">Oylama</span> · Crew decides</div><h2>The Polls</h2>
      <p>Results move live as the crew votes. Tap an option to vote; tap another to change it.</p></div>
      <div id="polls" class="grid g2"></div>
      <form class="panel stack" id="poll-form"><h3>Call a vote</h3>
        <label class="f">Question<input type="text" id="poll-q" maxlength="120" placeholder="Where next after the hamam?" required></label>
        <label class="f">Options, one per line<textarea id="poll-o" maxlength="600" placeholder="Kadıköy food crawl&#10;Karaköy rooftop&#10;Back to Ortaköy" required></textarea></label>
        <div><button class="btn primary" type="submit">Open the vote</button></div></form>
    </section>`;
  },
  mount() {
    $("#poll-form").onsubmit = e => { e.preventDefault(); if (!needMe()) return;
      const q = $("#poll-q").value.trim(); const o = $("#poll-o").value.split("\n").map(s => s.trim()).filter(Boolean).slice(0, 8);
      if (!q || o.length < 2) { toast("Add a question and at least two options."); return; }
      act(Store.put("polls", uid(), {q, o, by: ME, at: Date.now(), closed: false}), "Vote is open").then(ok => { if (ok) { $("#poll-q").value = ""; $("#poll-o").value = ""; } }); };
  },
  update() {
    const polls = [...D.polls].sort((a, b) => (a.closed - b.closed) || (b.at || 0) - (a.at || 0));
    $("#polls").innerHTML = polls.length ? polls.map(p => {
      const vs = D.votes.filter(v => v.poll === p.id);
      const counts = (p.o || []).map((_, i) => vs.filter(v => v.choice === i));
      const max = Math.max(1, ...counts.map(c => c.length));
      const mine = ME && vs.find(v => v.crew === ME);
      const lead = Math.max(0, ...counts.map(c => c.length));
      const canAdmin = p.by === ME || Store.owner;
      return `<article class="panel poll">
        <div class="spread"><span class="pill ${p.closed ? "" : "ok"}">${p.closed ? "Closed" : "Open"}</span><span class="muted mono" style="font-size:12px">${vs.length}/${CREW.length} voted</span></div>
        <h3 style="text-transform:none;font-size:24px">${h(p.q)}</h3>
        ${(p.o || []).map((o, i) => `<button type="button" class="opt ${mine && mine.choice === i ? "mine" : ""} ${lead && counts[i].length === lead ? "lead" : ""}" data-vote="${h(p.id)}" data-i="${i}" ${p.closed ? "disabled" : ""}>
          <span class="fill" style="width:${counts[i].length / max * 100}%"></span>
          <span style="min-width:0">${h(o)}${mine && mine.choice === i ? " ✓" : ""}<span class="avs" style="margin-top:4px">${counts[i].map(v => avatar(v.crew)).join("")}</span></span>
          <span class="n">${counts[i].length}</span></button>`).join("")}
        <div class="spread"><span class="muted" style="font-size:12px">Called by ${h(crewBy(p.by)?.name || "the organizer")}</span>
          ${canAdmin ? `<span class="row"><button class="link" type="button" data-close-poll="${h(p.id)}">${p.closed ? "Reopen" : "Close vote"}</button><button class="link" type="button" data-rm-poll="${h(p.id)}" style="color:var(--coral)">Delete</button></span>` : ""}</div>
      </article>`;
    }).join("") : `<div class="empty">No votes open yet. Call one below: where to eat, which bar, ATV or zipline.</div>`;
    $$("[data-vote]").forEach(b => b.onclick = () => { if (!needMe()) return;
      act(Store.put("votes", b.dataset.vote + "__" + ME, {poll: b.dataset.vote, crew: ME, choice: +b.dataset.i, at: Date.now()})); });
    $$("[data-close-poll]").forEach(b => b.onclick = () => { const p = D.polls.find(x => x.id === b.dataset.closePoll); act(Store.put("polls", p.id, {...stripId(p), closed: !p.closed})); });
    $$("[data-rm-poll]").forEach(b => b.onclick = () => confirmBox("Delete this poll and its votes?", async () => {
      for (const v of D.votes.filter(v => v.poll === b.dataset.rmPoll)) await Store.del("votes", v.id);
      await Store.del("polls", b.dataset.rmPoll);
    }));
  },
};
const stripId = o => { const {id, ...rest} = o; return rest; };

/* ---------- THE LEADERBOARD ---------- */
VIEWS.leaderboard = {
  shell() {
    const judge = ME === "umang" || Store.owner;
    return `<section class="view">
      <div class="head"><div class="eyebrow"><span lang="tr">Puan tablosu</span> · Standings</div><h2>The Leaderboard</h2>
      <p>Points from challenges and the groom's decrees. Awards unseal at 6:00 AM on Sun Nov 22, Istanbul time.</p></div>
      <div class="lb" id="lb"></div>
      <div class="stack"><h3>Final awards</h3><div class="grid g3" id="awards"></div><div id="reveal"></div></div>
      <div class="grid g2">
        <div class="panel stack"><h3>Punishment menu</h3><p class="muted" style="font-size:14px">Last place at the end of the mission draws one.</p>
          <ol class="plain">${PUNISHMENTS.map(p => `<li>${h(p)}</li>`).join("")}</ol><div id="punish"></div></div>
        ${judge ? `<form class="panel stack" id="decree-form"><h3>Groom's decree</h3>
          <p class="muted" style="font-size:14px">Bonus or penalty points, with a reason the crew can see.</p>
          <div class="grid g2"><label class="f">Agent<select id="dc-who">${CREW.map(c => `<option value="${c.key}">${h(c.name)}</option>`).join("")}</select></label>
          <label class="f">Points (+ or −)<input type="number" id="dc-pts" value="10" step="5" min="-100" max="100"></label></div>
          <label class="f">Reason<input type="text" id="dc-why" maxlength="120" placeholder="Carried the cooler up Kartepe" required></label>
          <div><button class="btn primary" type="submit">Issue decree</button></div></form>` : `<div class="panel stack" id="decrees-only"><h3>Groom's decrees</h3><div id="decrees"></div></div>`}
      </div>
      ${judge ? `<div class="panel stack"><h3>Decree log</h3><div id="decrees"></div></div>` : ""}
    </section>`;
  },
  mount() {
    const f = $("#decree-form"); if (!f) return;
    f.onsubmit = e => { e.preventDefault();
      const pts = parseInt($("#dc-pts").value, 10), why = $("#dc-why").value.trim();
      if (!pts || !why) { toast("Add points and a reason."); return; }
      act(Store.put("adjust", uid(), {crew: $("#dc-who").value, pts, why, by: ME || "", at: Date.now()}), "Decree issued").then(ok => { if (ok) $("#dc-why").value = ""; }); };
  },
  update() {
    const sc = scores(); const top = Math.max(1, sc[0]?.total || 0);
    const allZero = sc.every(r => r.total === 0);
    $("#lb").innerHTML = sc.map((r, i) => `<div class="lb-row ${!allZero && i === 0 ? "first" : ""} ${!allZero && i === sc.length - 1 ? "last" : ""}">
      <div class="rank">${i + 1}</div>${avatar(r.key)}
      <div style="min-width:0"><b>${h(crewBy(r.key).name)}</b>${(D.crew.find(x => x.id === r.key) || {}).nick ? ` <span class="nick">“${h(D.crew.find(x => x.id === r.key).nick)}”</span>` : ""}
        <div class="bar-track"><i style="width:${Math.max(0, r.total) / top * 100}%"></i></div>
        <div class="breakdown">${r.ch} challenges · ${r.bonus >= 0 ? "+" : ""}${r.bonus} decrees</div></div>
      <div class="pts" style="font-size:28px">${r.total}</div></div>`).join("");
    const open = awardsOpen();
    const by = (f) => { const best = [...sc].sort((a, b) => f(b) - f(a))[0]; return best && f(best) > 0 ? crewBy(best.key).name : "No one yet"; };
    const awards = [
      ["Sultan of the Bosphorus", "Most points overall", by(r => r.total)],
      ["Dare Devil", "Most challenges completed", by(r => r.chCount)],
      ["Voice of the People", "Most votes cast", by(r => r.votes)],
      ["The Anchor", "Last place. See punishment menu", allZero ? "No one yet" : crewBy(sc[sc.length - 1].key).name],
    ];
    $("#awards").innerHTML = awards.map(([t, d, w]) => `<div class="award ${open ? "" : "locked"}"><i class="medal"></i><b>${h(t)}</b><span class="muted" style="font-size:13px">${h(d)}</span>
      <span class="mono" style="font-size:14px">${open ? h(w) : "Sealed"}</span></div>`).join("");
    $("#reveal").innerHTML = !open && (Store.owner || Store.mode === "local") ? `<button class="btn small" type="button" id="reveal-btn">Unseal awards now</button>` : "";
    const rb = $("#reveal-btn"); if (rb) rb.onclick = () => confirmBox("Unseal the awards for everyone now?", () => Store.put("settings", "main", {...stripId(settings()), reveal: true}));
    const st = settings();
    $("#punish").innerHTML = st.punishment != null && PUNISHMENTS[st.punishment] ? `<div class="banner warn" style="margin:0"><b>Drawn:</b> ${h(PUNISHMENTS[st.punishment])}</div>`
      : open ? `<button class="btn small" type="button" id="draw">Draw the punishment</button>` : `<span class="muted" style="font-size:13px">Draw unlocks with the awards.</span>`;
    const dr = $("#draw"); if (dr) dr.onclick = () => act(Store.put("settings", "main", {...stripId(st), punishment: Math.floor(Math.random() * PUNISHMENTS.length)}), "Punishment drawn");
    const dec = [...D.adjust].sort((a, b) => b.at - a.at);
    const el = $("#decrees"); if (el) el.innerHTML = dec.length ? `<div class="tbl"><table><tbody>${dec.map(a => `<tr><td>${h(crewBy(a.crew)?.name || "")}</td><td class="mono" style="color:${a.pts >= 0 ? "var(--ok)" : "var(--coral)"}">${a.pts >= 0 ? "+" : ""}${a.pts}</td><td>${h(a.why)}</td>${ME === "umang" || Store.owner ? `<td><button class="link" type="button" data-rmd="${h(a.id)}" style="color:var(--coral)">Remove</button></td>` : ""}</tr>`).join("")}</tbody></table></div>` : `<p class="muted">No decrees yet.</p>`;
    $$("[data-rmd]").forEach(b => b.onclick = () => confirmBox("Remove this decree?", () => Store.del("adjust", b.dataset.rmd)));
  },
};

/* ============================================================
   ROUTER
   ============================================================ */
let current = null, raf = 0;
function route(force = false) {
  const k = (location.hash || "").slice(1);
  const HIDDEN = ["challenges", "vault"]; // hidden for now; remove from this list to bring it back
  const name = VIEWS[k] && !HIDDEN.includes(k) ? k : "mission";
  if (name === current && !force) return;
  current = name;
  $("#tabs").innerHTML = ORDER.map(([key, t]) => `<a href="#${key}" ${key === name ? `aria-current="page"` : ""}>${t.replace("The ", "")}</a>`).join("");
  $("#view").innerHTML = VIEWS[name].shell();
  VIEWS[name].mount && VIEWS[name].mount();
  VIEWS[name].update();
  const tab = $("#tabs [aria-current]"); if (tab) tab.scrollIntoView({block: "nearest", inline: "center"});
}
function changed() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => { if (current) { VIEWS[current].update(); } paintStatus(); });
}
window.addEventListener("hashchange", () => { route(); scrollTo({top: 0}); });
$("#me-chip").onclick = pickMe;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-eye]"); if (!b) return;
  const i = document.getElementById(b.dataset.eye); if (!i) return;
  const show = i.type === "password"; i.type = show ? "text" : "password"; b.textContent = show ? "Hide" : "Show";
});

paintStatus();
route();
Store.init().then(ok => { if (ok) route(true); });
</script>
