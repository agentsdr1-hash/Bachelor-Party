<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Operation Bosphorus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: a modern travel journal. Full-bleed night hero over the Istanbul skyline, then calm cards.
   Phones get an app-style bottom tab bar; wide screens a top nav. Turkish accents: nazar bead, kilim band,
   Iznik tile, Turkish section names.
   Palette: porcelain stone / deep lapis, Iznik red (primary), turquoise, Ottoman gold, cobalt.
   Type: Archivo, expanded width for display, normal width for text; JetBrains Mono only for times. */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --panel-2:#f6f7f9; --line:#e1e4ea;
  --ink:#0e1a2e; --muted:#5b6577;
  --tile:#1f4fb3; --turq:#0e7a70; --coral:#c2372b; --gold:#93650a;
  --ok:#1d8a55; --warn:#93650a; --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(14,26,46,.05),0 8px 24px -12px rgba(14,26,46,.12);
  /* the hero is always night */
  --hero-bg:#0b1a34; --hero-ink:#f3f1ea; --hero-muted:#a9b6cb; --hero-line:rgba(243,241,234,.16);
  --hero-sky:#1a3360; --hero-red:#f0594b; --hero-gold:#e8b75a; --sky:#1a3360;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1120; --panel:#111a2c; --panel-2:#162136; --line:#24304a;
  --ink:#eef0f4; --muted:#9aa6bb; --tile:#5b86f0; --turq:#3cc0b2; --coral:#ef5a4c; --gold:#e4b158;
  --ok:#4cc38a; --warn:#e4b158; --on-accent:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.3);
  --hero-bg:#081429; --hero-sky:#17305c; --sky:#17305c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1120; --panel:#111a2c; --panel-2:#162136; --line:#24304a;
  --ink:#eef0f4; --muted:#9aa6bb; --tile:#5b86f0; --turq:#3cc0b2; --coral:#ef5a4c; --gold:#e4b158;
  --ok:#4cc38a; --warn:#e4b158; --on-accent:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.3);
  --hero-bg:#081429; --hero-sky:#17305c; --sky:#17305c; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);margin:0;-webkit-font-smoothing:antialiased;font-variation-settings:"wdth" 100}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
[hidden]{display:none!important}
img{max-width:100%}
a{color:var(--turq);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.05}
h1,h2{font-variation-settings:"wdth" 118;font-weight:800}
h2{font-size:clamp(30px,5.4vw,42px)}
h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 12px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow [lang="tr"]{color:var(--coral)}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px)}
.bar::after{content:"";display:block;height:4px;background:var(--kilim) 0 0/28px 4px repeat-x;opacity:.9}
.bar-top{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{font:800 17px/1 var(--f-display);font-variation-settings:"wdth" 112;letter-spacing:-.01em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand small{font:500 12px/1 var(--f-body);color:var(--muted);letter-spacing:.02em}
.brand i{display:inline-block;width:22px;height:22px;border-radius:50%;flex:none;
  background:radial-gradient(circle,#0b0f1a 0 17%,#7fc6f0 18% 33%,#ffffff 34% 52%,#1d4fc4 53% 100%);box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{text-decoration:none;color:var(--muted);font:600 14px/1 var(--f-body);padding:9px 12px;border-radius:999px;white-space:nowrap}
.tabs a:hover{color:var(--ink);background:var(--panel-2)}
.tabs a[aria-current="page"]{color:var(--ink);background:color-mix(in srgb,var(--coral) 11%,transparent)}
.status{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--ok)}
.status .label{display:none}
.me-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;white-space:nowrap;font-size:14px;font-weight:600}
.me-chip .av{width:28px;height:28px;font-size:12px}

/* bottom tab bar (phones) */
.bnav{display:none}
@media (max-width:860px){
  .tabs{display:none}
  .status{margin-left:auto}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;
    background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bnav a{display:grid;justify-items:center;gap:3px;padding:6px 2px;text-decoration:none;color:var(--muted);font:600 11px/1 var(--f-body);border-radius:12px}
  .bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav a[aria-current="page"]{color:var(--coral)}
  .bnav a[aria-current="page"] svg{stroke-width:2.2}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
}

main{padding-block:32px 80px}
section.view{display:grid;gap:32px}
.head{display:grid;gap:10px}
.head p{max-width:60ch;color:var(--muted);font-size:17px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.panel>h3+*{margin-top:12px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-title h2{font-size:clamp(24px,4vw,30px)}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}
.btn.primary{background:var(--coral);border-color:var(--coral);color:var(--on-accent)}
.btn.danger{color:var(--coral)}
.btn.small{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--turq);cursor:pointer;font-weight:600;font-size:13px}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%;color:var(--ink);font-size:16px}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font:600 12px/1.4 var(--f-body);white-space:nowrap;background:color-mix(in srgb,currentColor 10%,transparent);color:var(--muted)}
.pill.party{color:var(--coral)} .pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.turq{color:var(--turq)}
.pts{font:700 16px/1 var(--f-body);color:var(--gold);white-space:nowrap}

/* avatars */
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 17px/1 var(--f-body);color:var(--on-accent);background:var(--turq);overflow:hidden;text-transform:uppercase}
.av img{width:100%;height:100%;object-fit:cover}
.av.c1{background:var(--coral)} .av.c2{background:var(--tile)} .av.c3{background:var(--gold)} .av.c4{background:var(--ok)}
.avs{display:flex}.avs .av{width:24px;height:24px;font-size:11px;border:2px solid var(--panel);margin-left:-6px}.avs .av:first-child{margin-left:0}

/* hero (full-bleed, always night) */
#hero-slot:empty{display:none}
.hero{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-ink)}
.hero::before{content:"";position:absolute;inset:0;background:#3a6cf0;opacity:.09;-webkit-mask:var(--star) 0 0/64px 64px repeat;mask:var(--star) 0 0/64px 64px repeat;pointer-events:none}
.hero-inner{position:relative;z-index:2;padding-block:clamp(40px,8vw,88px) clamp(120px,17vw,190px);display:grid;gap:18px}
.hero canvas.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:clamp(96px,15vw,170px);z-index:1;pointer-events:none}
.hero .eyebrow{color:var(--hero-muted)}
.hero .eyebrow [lang="tr"]{color:var(--hero-red)}
.hero h1{font-size:clamp(36px,10.4vw,104px);line-height:.95;letter-spacing:-.035em;font-variation-settings:"wdth" 122;max-width:12ch}
.hero h1 em{font-style:normal;color:var(--hero-red)}
@media (max-width:560px){.hero h1{font-variation-settings:"wdth" 106;max-width:none}}
.hero .sub{font-size:clamp(16px,2.2vw,19px);color:var(--hero-muted);max-width:52ch}
.cds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:0;margin-top:14px;border-top:1px solid var(--hero-line);max-width:760px}
.cd-block{padding:18px 24px 6px 0;display:grid;gap:6px;align-content:start}
.cd-block+.cd-block{padding-left:24px;border-left:1px solid var(--hero-line)}
@media (max-width:640px){.cd-block+.cd-block{padding-left:0;border-left:0;border-top:1px solid var(--hero-line)}}
.cd-label{font:500 12px/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--hero-muted)}
.cd-title{font:700 20px/1.1 var(--f-display);letter-spacing:-.01em;color:var(--hero-red)}
.cd-block.wed .cd-title{color:var(--hero-gold)}
.countdown{display:grid;grid-template-columns:repeat(3,max-content);gap:0 26px;margin-top:6px}
.cd{display:grid;gap:4px}
.cd b{font:700 clamp(34px,6vw,52px)/1 var(--f-display);font-variation-settings:"wdth" 110;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--hero-ink)}
.cd span{font:500 11px/1 var(--f-body);letter-spacing:.08em;color:var(--hero-muted);text-transform:uppercase}
.cd-sub{font-size:14px;color:var(--hero-muted);margin-top:4px}

/* home: next up, route, numbers */
.next{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.next .when{background:color-mix(in srgb,var(--coral) 10%,transparent);color:var(--coral);border-radius:14px;padding:12px 14px;text-align:center;min-width:76px}
.next .when b{display:block;font:800 30px/1 var(--f-display);font-variation-settings:"wdth" 112}
.next .when span{font:600 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.06em}
.next .what{display:grid;gap:6px;min-width:0}
.next .what strong{font-size:19px;line-height:1.3}
.later{display:grid;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.later div{display:grid;grid-template-columns:92px 1fr;gap:12px;font-size:14px}
.route{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:14px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
@media (min-width:900px){.route{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);overflow:visible}}
.leg{scroll-snap-align:start;position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:18px;cursor:pointer;display:grid;gap:8px;align-content:start;color:var(--ink);box-shadow:var(--shadow)}
.leg:hover{border-color:color-mix(in srgb,var(--coral) 40%,var(--line))}
.leg .n{display:flex;align-items:center;gap:8px;font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.leg .n i{width:10px;height:10px;border-radius:50%;background:var(--coral);flex:none}
.leg.away .n i{background:var(--turq)}
.leg b{font:800 22px/1.05 var(--f-display);font-variation-settings:"wdth" 114;letter-spacing:-.02em}
.leg p{font-size:14px;color:var(--muted)}
.leg .km{font:500 12px/1 var(--f-mono);color:var(--turq)}
.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.numbers div{background:var(--panel);padding:18px;display:grid;gap:4px}
.numbers b{font:800 30px/1 var(--f-display);font-variation-settings:"wdth" 114;letter-spacing:-.02em}
.numbers span{font-size:13px;color:var(--muted)}
.votes-mini{display:grid;gap:10px}
.votes-mini a{display:flex;justify-content:space-between;gap:12px;align-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--panel-2)}
.votes-mini a span{color:var(--muted);font-size:13px;white-space:nowrap}

/* map */
.map-box{position:relative;z-index:0;isolation:isolate;height:min(68vh,620px);min-height:340px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--panel-2)}
@media (max-width:560px){.map-box{height:56vh}}
.map-box .leaflet-control-attribution{font-size:10px}
.map-box.dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6)}
.map-pin{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--f-body);color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.map-pin.base{width:30px;height:30px;border-radius:8px;background:var(--coral);font-size:14px}
.map-list{display:grid;gap:6px}
.map-item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;color:var(--ink)}
.map-item .map-pin{width:22px;height:22px;font-size:11px}
.leaflet-popup-content{font:14px/1.45 var(--f-body)}
.leaflet-popup-content b{font-family:var(--f-display);font-size:16px}

/* crew */
.crew-card{display:grid;gap:14px;align-content:start}
.crew-top{display:flex;gap:14px;align-items:center}
.crew-top .av{width:72px;height:72px;font-size:28px}
.crew-name{font:800 26px/1 var(--f-display);font-variation-settings:"wdth" 114;letter-spacing:-.02em}
.nick{color:var(--turq);font:600 14px/1.3 var(--f-body)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.nights{display:flex;gap:4px}
.nights i{width:100%;max-width:26px;height:6px;border-radius:3px;background:var(--line)}
.nights i.on{background:var(--turq)}

/* tables, checklists */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px/1.2 var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--panel-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{margin-top:3px;accent-color:var(--coral);width:18px;height:18px;flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
ul.plain{margin:0;padding-left:18px;display:grid;gap:8px}

/* itinerary */
.daypick{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.daypick button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;cursor:pointer;display:grid;gap:3px;text-align:center;min-width:64px;color:var(--ink)}
.daypick button b{font:800 22px/1 var(--f-display);font-variation-settings:"wdth" 112}
.daypick button span{font:600 11px/1 var(--f-body);letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.daypick button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.daypick button[aria-pressed="true"] span{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.daypick button.today span{color:var(--coral)}
.timeline{display:grid}
.tl{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.tl:last-child{border-bottom:0}
.tl time{font:500 13px/1.6 var(--f-mono);color:var(--muted)}
.tl .what{display:grid;gap:4px;min-width:0}
.changed{font-size:13px;color:var(--gold)}
.wear{background:var(--panel-2);border-radius:var(--r-sm);padding:14px 16px;font-size:14px}
.wear b{font:600 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}

/* list rows (backlog, challenges) */
.ch{display:grid;grid-template-columns:1fr auto;gap:10px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.ch:last-child{border-bottom:0}
.ch .t{font-weight:600}
.ch .d{font-size:14px;color:var(--muted)}
.ch .side{display:grid;gap:8px;justify-items:end}
.ch .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;grid-column:1/-1}

/* vault (hidden for now) */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,170px),1fr));gap:8px}
.shot{position:relative;aspect-ratio:1;max-width:100%;border-radius:var(--r-sm);overflow:hidden;background:var(--panel-2);border:1px solid var(--line);cursor:pointer;padding:0}
.shot img,.shot video{width:100%;height:100%;object-fit:cover;display:block}
.shot .cap{position:absolute;inset:auto 0 0 0;padding:18px 8px 6px;font-size:12px;text-align:left;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.shot .play{position:absolute;top:6px;right:6px;font:600 10px/1 var(--f-body);background:rgba(0,0,0,.6);color:#fff;padding:4px 6px;border-radius:4px}
.jokes{display:grid;gap:10px}
.joke{background:var(--panel-2);border-radius:var(--r-sm);padding:12px 14px;display:grid;gap:6px}
.joke q{font-size:16px;font-weight:600}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}
.ph{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);font:600 11px/1 var(--f-body)}

/* polls */
.poll{display:grid;gap:12px}
.opt{position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:12px 14px;cursor:pointer;overflow:hidden;color:var(--ink)}
.opt .fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--turq) 16%,transparent);transition:width .5s ease}
.opt>*:not(.fill){position:relative}
.opt.mine{border-color:var(--turq)}
.opt.lead .n{color:var(--turq)}
.opt .n{font:600 14px/1 var(--f-mono)}
.opt[disabled]{cursor:default}

/* leaderboard (hidden for now) */
.lb{display:grid;gap:8px}
.lb-row{display:grid;grid-template-columns:34px 44px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.lb-row .rank{font:800 26px/1 var(--f-display);color:var(--muted);text-align:center}
.lb-row.first{border-color:var(--gold)}
.lb-row.first .rank{color:var(--gold)}
.lb-row.last{border-style:dashed;border-color:var(--coral)}
.bar-track{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--gold);border-radius:3px}
.breakdown{font-size:12px;color:var(--muted)}
.award{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;justify-items:center}
.award .medal{width:40px;height:40px;background:var(--gold);-webkit-mask:var(--star) center/contain no-repeat;mask:var(--star) center/contain no-repeat}
.award b{font:700 18px/1.1 var(--f-display)}
.award.locked{color:var(--muted)}
.award.locked .medal{background:var(--line)}

/* banner, toast, dialog */
.banner{border-radius:var(--r-sm);padding:10px 14px;font-size:14px;border:1px solid var(--line);background:var(--panel)}
#banner{margin:0 0 20px}
.banner.warn{border-color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:0;width:min(520px,calc(100% - 32px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(5,10,22,.6)}
.dlg{padding:22px;display:grid;gap:14px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.who-grid button{display:grid;gap:6px;justify-items:center;border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:12px 6px;cursor:pointer;font-weight:600;color:var(--ink)}
.who-grid button[aria-pressed="true"]{border-color:var(--coral)}
.lightbox{width:min(980px,calc(100% - 16px))}
.lightbox img,.lightbox video{width:100%;max-height:72vh;object-fit:contain;background:#000;display:block}
@media (max-width:560px){
  .tl{grid-template-columns:1fr;gap:4px}
  .lb-row{grid-template-columns:26px 36px 1fr auto;gap:8px}
  .lb-row .av{width:36px;height:36px}
  .next{grid-template-columns:1fr}
  .next .when{justify-self:start;display:flex;gap:8px;align-items:baseline}
  .later div{grid-template-columns:80px 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

   STORE — Supabase (shared, signed-in crew) or this-browser fallback
   Data model: one table `docs(coll, id, data jsonb)`; see supabase/schema.sql
   ============================================================ */
const COLLS = ["crew","challenges","completions","polls","votes","vault","jokes","adjust","bookings","secrets","settings"];
const D = {}; COLLS.forEach(c => D[c] = []);
const CFG = window.BP_CONFIG || {};
const SB = (CFG.supabaseUrl && CFG.supabaseAnonKey && !/YOUR_/.test(CFG.supabaseUrl) && window.supabase)
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey) : null;
const BUCKET = "vault";
// No sign-in: whoever picks the organizer's name gets the organizer tools (sealed messages, unseal awards).
const isOrganizer = () => !!ME && ME === (CFG.organizer || "");
const MAX_UPLOAD = 50 * 1024 * 1024;

const Store = {
  mode: "connecting", owner: false, member: null, channel: null,
  async init() {
    if (!SB) {
      this.mode = "local";
      COLLS.forEach(name => D[name] = this.localAll(name));
      showBanner("Preview mode: Supabase isn't configured, so everything is saved in this browser only. See README to connect it.");
      changed(); paintStatus(); return true;
    }
    this.mode = "live";
    this.owner = isOrganizer();
    await this.loadAll();
    this.subscribe();
    paintStatus(); return true;
  },
  async loadAll() {
    const next = {}; COLLS.forEach(c => next[c] = []);
    for (let from = 0; ; from += 1000) {
      const {data, error} = await SB.from("docs").select("coll,id,data").range(from, from + 999);
      if (error) { showBanner("Couldn't load shared data. Check your connection; it retries when you reload.", "warn"); return; }
      data.forEach(r => { if (next[r.coll]) next[r.coll].push({id: r.id, ...r.data}); });
      if (data.length < 1000) break;
    }
    COLLS.forEach(c => D[c] = next[c]); hideBanner(); changed();
  },
  subscribe() {
    let dropped = false;
    this.channel = SB.channel("docs-live")
      .on("postgres_changes", {event: "*", schema: "public", table: "docs"}, ev => {
        const row = ev.eventType === "DELETE" ? ev.old : ev.new;
        if (!row || !D[row.coll]) return;
        const list = D[row.coll].filter(x => x.id !== row.id);
        if (ev.eventType !== "DELETE") list.push({id: row.id, ...row.data});
        D[row.coll] = list; changed();
      })
      .subscribe(status => {
        if (status === "SUBSCRIBED") { if (dropped) { dropped = false; this.loadAll(); } hideBanner(); paintStatus(true); }
        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") { dropped = true; paintStatus(false); showBanner("Live updates paused. Reconnecting…", "warn"); }
      });
  },
  localAll(name) { const o = LS.get("bp:db:" + name, {}); return Object.entries(o).map(([id, v]) => ({id, ...v})); },
  localWrite(name, fn) {
    const o = LS.get("bp:db:" + name, {}); fn(o);
    if (!LS.set("bp:db:" + name, o)) throw {code: "quota_exceeded"};
    D[name] = this.localAll(name); changed();
  },
  async put(name, id, data) {
    if (this.mode !== "live") return this.localWrite(name, o => { o[id] = data; });
    const {error} = await SB.from("docs").upsert({coll: name, id, data, updated_by: ME});
    if (error) throw error;
    // Apply locally right away; the realtime echo is idempotent.
    D[name] = [...D[name].filter(x => x.id !== id), {id, ...data}]; changed();
  },
  async del(name, id) {
    if (this.mode !== "live") return this.localWrite(name, o => { delete o[id]; });
    const doc = D[name].find(x => x.id === id);
    const {error} = await SB.from("docs").delete().eq("coll", name).eq("id", id);
    if (error) throw error;
    D[name] = D[name].filter(x => x.id !== id); changed();
    if (doc && doc.path) SB.storage.from(BUCKET).remove([doc.path]).catch(() => {});
  },
  canUpload() { return true; },
  async upload(file) {
    const isVideo = file.type.startsWith("video/");
    if (this.mode === "live") {
      const blob = isVideo ? file : await shrink(file, 1800, .84).catch(() => file);
      if (blob.size > MAX_UPLOAD) throw {message: "That file is over 50 MB. Trim the video or pick a shorter clip."};
      const ext = isVideo ? (file.name.split(".").pop() || "mp4").toLowerCase().replace(/[^a-z0-9]/g, "") : "jpg";
      const path = `${ME}/${uid()}.${ext}`;
      const {error} = await SB.storage.from(BUCKET).upload(path, blob, {contentType: isVideo ? file.type : "image/jpeg", upsert: false});
      if (error) throw error;
      return {path, kind: isVideo ? "video" : "image"};
    }
    if (isVideo) throw {message: "Videos need the live site. Preview mode keeps photos only."};
    const small = await shrink(file, 900, .72);
    return {url: await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(small); }), kind: "image"};
  },
};

/* Private bucket: files are shown through signed links, fetched in batches and cached. */
const SIGNED = new Map(); const PENDING = new Set(); let signTimer = 0;
const SIGN_TTL = 60 * 60 * 24 * 7;
function mediaSrc(o) {
  if (!o) return "";
  if (o.url) return o.url;
  const path = o.path || o.photoPath;
  if (!path || !SB) return "";
  const hit = SIGNED.get(path);
  if (hit && hit.exp > Date.now()) return hit.url;
  PENDING.add(path);
  clearTimeout(signTimer); signTimer = setTimeout(signPending, 30);
  return "";
}
async function signPending() {
  const paths = [...PENDING]; PENDING.clear(); if (!paths.length) return;
  const {data, error} = await SB.storage.from(BUCKET).createSignedUrls(paths, SIGN_TTL);
  if (error || !data) return;
  const by = new Map(data.map(d => [d.path, d]));
  // Cache misses too (deleted file), so a broken path can't trigger a render loop.
  paths.forEach(p => { const d = by.get(p); SIGNED.set(p, d && d.signedUrl ? {url: d.signedUrl, exp: Date.now() + (SIGN_TTL - 3600) * 1000} : {url: "", exp: Date.now() + 300000}); });
  changed();
}

function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b => b ? res(b) : rej(new Error("Couldn't read that photo.")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("This browser can't read that photo format. Try a JPEG or PNG.")); };
    img.src = url;
  });
}

  const m = txt.match(/(\d{1,2})(?::(\d{2}))?(?:\s*[–-]\s*\d{1,2}(?::\d{2})?)?\s*(AM|PM)/i);
  let hh = 12, mm = 0;
  if (m) { hh = (+m[1] % 12) + (m[3].toUpperCase() === "PM" ? 12 : 0); mm = +(m[2] || 0); }
  else if (/morning/i.test(txt)) hh = 9; else if (/evening/i.test(txt)) hh = 19;
  return Date.parse(`${d.date}T${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}:00+03:00`);
}

      }).join("") : `<div class="empty">No open votes. Start one in Polls.</div>`}</div>`;

};
function drawSkylines() {
  const css = getComputedStyle(document.documentElement);
  const sky = css.getPropertyValue("--hero-sky").trim() || "#1a3360";
  const moon = css.getPropertyValue("--hero-gold").trim() || "#e8b75a";
  $$("canvas.skyline").forEach(cv => {
    const w = cv.clientWidth, hgt = cv.clientHeight; if (!w || !hgt) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = w * dpr; cv.height = hgt * dpr;
    const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, hgt);
    const base = hgt - 6, u = hgt / 100;
    // crescent moon (cut a circle out of a circle)
    const mx = w * .86, my = hgt * .22, mr = 11 * u;
    c.fillStyle = moon; c.beginPath(); c.arc(mx, my, mr, 0, Math.PI * 2); c.fill();
    c.globalCompositeOperation = "destination-out"; c.beginPath(); c.arc(mx + mr * .38, my - mr * .12, mr * .84, 0, Math.PI * 2); c.fill();
    c.globalCompositeOperation = "source-over";
    c.fillStyle = sky;
    const rect = (x, y, ww, hh) => c.fillRect(x, y, ww, hh);
    const dome = (x, r, lift = 0) => { c.beginPath(); c.ellipse(x, base - lift, r, r * .92, 0, Math.PI, 0); c.fill(); };
    const minaret = (x, hh) => { const mw = 2.6 * u; rect(x - mw / 2, base - hh, mw, hh); rect(x - mw, base - hh * .72, mw * 2, 1.8 * u);
      c.beginPath(); c.moveTo(x - mw / 2, base - hh); c.lineTo(x, base - hh - 14 * u); c.lineTo(x + mw / 2, base - hh); c.fill(); };
    const mosque = (x, s) => { rect(x - 34 * s * u, base - 16 * s * u, 68 * s * u, 16 * s * u);
      dome(x - 20 * s * u, 10 * s * u, 16 * s * u); dome(x + 20 * s * u, 10 * s * u, 16 * s * u); dome(x, 22 * s * u, 18 * s * u);
      rect(x - 1, base - 52 * s * u, 2, 12 * s * u);
      [-44, 44].forEach(dx => minaret(x + dx * s * u, 62 * s * u)); };
    const galata = x => { rect(x - 6 * u, base - 58 * u, 12 * u, 58 * u); rect(x - 8 * u, base - 62 * u, 16 * u, 5 * u);
      c.beginPath(); c.moveTo(x - 8 * u, base - 62 * u); c.lineTo(x, base - 86 * u); c.lineTo(x + 8 * u, base - 62 * u); c.fill(); };
    // waterline and low city
    rect(0, base, w, hgt - base);
    for (let x = 0; x < w; x += 18 * u) rect(x, base - (6 + ((x * 7) % 11)) * u, 16 * u, (6 + ((x * 7) % 11)) * u);
    const scale = Math.min(1.25, Math.max(.7, w / 900));
    mosque(w * .2, scale); mosque(w * .48, scale * .82); galata(w * .68);
    [w * .06, w * .34, w * .6].forEach(x => minaret(x, 44 * u));
    // Bosphorus bridge on the right
    const bx = w * .78, bw = w * .2; c.strokeStyle = sky; c.lineWidth = Math.max(1, u * .9);
    rect(bx, base - 40 * u, 2.4 * u, 40 * u); rect(bx + bw, base - 40 * u, 2.4 * u, 40 * u); rect(bx - 10 * u, base - 14 * u, bw + 22 * u, 2.4 * u);
    c.beginPath(); c.moveTo(bx, base - 40 * u); c.quadraticCurveTo(bx + bw / 2, base - 4 * u, bx + bw, base - 40 * u); c.stroke();
  });
}
window.addEventListener("resize", () => { clearTimeout(drawSkylines.t); drawSkylines.t = setTimeout(drawSkylines, 150); });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { drawSkylines(); if (current === "map") route(true); });

let cdTimer = null;
// Wedding date lives in config.js (weddingAt, weddingPlace) so it can change without touching code.
const T_WEDDING = Date.parse((window.BP_CONFIG || {}).weddingAt || "");
const WEDDING_PLACE = (window.BP_CONFIG || {}).weddingPlace || "";
function cdDigits(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return [[Math.floor(s / 86400), "Days"], [Math.floor(s % 86400 / 3600), "Hours"], [Math.floor(s % 3600 / 60), "Min"]]
    .map(([v, l]) => `<div class="cd"><b>${String(v).padStart(2, "0")}</b><span>${l}</span></div>`).join("");
}
function tickCountdown() {
  clearInterval(cdTimer);
  const paint = () => {
    const el = $("#cd"); if (!el) { clearInterval(cdTimer); return; }
    const now = Date.now();
    const set = (id, txt) => { const n = $("#" + id); if (n) n.textContent = txt; };
    const done = (big, small) => `<div class="cd"><b>${big}</b><span>${small}</span></div>`;
    // Bachelor trip
    if (now < T_START) {
      set("cd-label", "Istanbul, Turkey"); set("cd-title", "Umang's last hurrah"); el.innerHTML = cdDigits(T_START - now);
      set("cd-sub", "Sat, Nov 14, 2026");
    } else if (now < T_END) {
      set("cd-label", `Istanbul, Turkey · Day ${tripDay() || "…"} of 9`); set("cd-title", "Last hurrah: live"); el.innerHTML = cdDigits(T_END - now);
      set("cd-sub", "Until Sun, Nov 22, 2026");
    } else {
      set("cd-label", "Istanbul, Turkey"); set("cd-title", "Hurrah complete"); el.innerHTML = "";
      set("cd-sub", "Nov 14–22, 2026");
    }
    // Wedding
    const wd = $("#wd");
    const wdate = Number.isFinite(T_WEDDING) ? new Intl.DateTimeFormat("en-US", {weekday: "short", month: "short", day: "numeric", year: "numeric", timeZone: (window.BP_CONFIG || {}).weddingTz || undefined}).format(T_WEDDING) : "";
    set("wd-label", WEDDING_PLACE || "The wedding");
    if (!Number.isFinite(T_WEDDING)) { set("wd-title", "Umang says yes"); wd.innerHTML = done("TBA", "Date to be announced"); set("wd-sub", ""); }
    else if (now < T_WEDDING) { set("wd-title", "Umang says yes"); wd.innerHTML = cdDigits(T_WEDDING - now); set("wd-sub", wdate); }
    else { set("wd-title", "He said yes"); wd.innerHTML = ""; set("wd-sub", wdate); }
  };
  paint(); cdTimer = setInterval(paint, 15000);
}

/* ---------- THE MAP ---------- */
let mapDay = "all", leafletMap = null, mapLayer = null, mapMarkers = [];
function loadLeaflet() {
  return window.L ? Promise.resolve(window.L) : Promise.reject(new Error("The map library didn't load."));
}
function mapStops() {
  const out = [];
  DAYS.forEach(d => d.items.forEach(([time, plan, q]) => {
    if (q && PLACES[q] && !(q === "Istanbul Airport" && out.some(o => o.q === q && o.day === d.n))) out.push({day: d.n, label: d.label, time, plan, q, ll: PLACES[q]});
  }));
  return out;
}
const isDark = () => getComputedStyle(document.documentElement).colorScheme.includes("dark");
VIEWS.map = {
  shell() {
    return `<section class="view">
      <div class="head"><div class="eyebrow"><span lang="tr">Harita</span> · Every stop</div><h2>Map</h2>
      <p>Every stop from the itinerary, colored by day. Tap a pin for the plan and directions. Pins are approximate; Google Maps has the exact spot.</p></div>
      <div class="chips" id="map-days">${[["all", "All days"], ...DAYS.map(d => [String(d.n), `Day ${d.n} · ${d.dow}`])].map(([v, l]) =>
        `<button class="chip" type="button" data-md="${v}" aria-pressed="${mapDay === v}">${l}</button>`).join("")}</div>
      <div class="row"><button class="btn small" type="button" id="map-city">Istanbul</button><button class="btn small" type="button" id="map-all">Whole trip (Sapanca + Thrace)</button><button class="btn small" type="button" id="map-base">Base</button></div>
      <div class="map-box" id="map"><div class="empty" style="border:0;height:100%;display:grid;place-items:center">Loading map…</div></div>
      <div class="map-list" id="map-list"></div>
    </section>`;
  },
  async mount() {
    const token = this.token = (this.token || 0) + 1;
    $$("[data-md]").forEach(b => b.onclick = () => { mapDay = b.dataset.md; $$("[data-md]").forEach(x => x.setAttribute("aria-pressed", x === b)); this.draw(true); });
    try { await loadLeaflet(); } catch (e) { $("#map").innerHTML = `<div class="empty" style="border:0">${h(e.message)} Check your connection and reload.</div>`; return; }
    if (!$("#map") || token !== this.token) return; // navigated away or re-mounted while loading
    if (this.ro) { this.ro.disconnect(); this.ro = null; }
    if (leafletMap) { leafletMap.stop(); leafletMap.off(); leafletMap.remove(); leafletMap = null; }
    $("#map").innerHTML = "";
    leafletMap = L.map("map", {zoomControl: true, attributionControl: true, scrollWheelZoom: false}).setView([41.03, 28.99], 12);
    $("#map").classList.toggle("dark", isDark());
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, referrerPolicy: "strict-origin-when-cross-origin", // OSM requires a referrer
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
    }).addTo(leafletMap);
    mapLayer = L.layerGroup().addTo(leafletMap);
    $("#map-city").onclick = () => leafletMap.fitBounds([[40.98, 28.95], [41.08, 29.05]]);
    $("#map-all").onclick = () => this.fit(true);
    $("#map-base").onclick = () => leafletMap.setView(BASE_LATLNG, 15);
    this.draw(false);
    // Leaflet needs the box's real size, which phones only know after layout.
    // Fitting to a zero-size box zooms all the way in, so wait for a real size.
    const box = $("#map"), m = leafletMap; let fitted = false;
    const settle = () => {
      if (leafletMap !== m) return;
      m.invalidateSize();
      if (!fitted && box.clientWidth > 50 && box.clientHeight > 50) { fitted = true; this.fit(false, false); }
    };
    if (window.ResizeObserver) { this.ro = new ResizeObserver(settle); this.ro.observe(box); }
    requestAnimationFrame(settle); setTimeout(settle, 300); setTimeout(settle, 1000);
  },
  fit(all, animate = true) {
    const pts = (all ? mapStops() : mapMarkers.map(m => m.s)).map(s => s.ll).concat([BASE_LATLNG]);
    if (pts.length) leafletMap.fitBounds(pts, {padding: [30, 30], maxZoom: 15, animate});
  },
  draw(fit) {
    if (!leafletMap) return;
    mapLayer.clearLayers(); mapMarkers = [];
    const icon = (txt, color, cls = "") => L.divIcon({className: "", iconSize: [26, 26], iconAnchor: [13, 13],
      html: `<span class="map-pin ${cls}" style="${color ? "background:" + color : ""}">${txt}</span>`});
    L.marker(BASE_LATLNG, {icon: icon("★", "", "base"), zIndexOffset: 1000}).addTo(mapLayer)
      .bindPopup(`<b>Base · Airbnb</b><br>${h(BASE)}<br><a href="${mapUrl(BASE)}" target="_blank" rel="noopener">Directions ↗</a>`);
    const stops = mapStops().filter(s => mapDay === "all" || String(s.day) === mapDay);
    stops.forEach(s => {
      const m = L.marker(s.ll, {icon: icon(s.day, DAY_COLORS[s.day - 1])}).addTo(mapLayer)
        .bindPopup(`<b>Day ${s.day} · ${h(s.time)}</b><br>${h(s.plan)}<br><span style="opacity:.7">${h(s.label)}</span><br><a href="${mapUrl(s.q)}" target="_blank" rel="noopener">Open in Google Maps ↗</a>`);
      mapMarkers.push({m, s});
    });
    $("#map-list").innerHTML = stops.map((s, i) => `<button class="map-item" type="button" data-mi="${i}">
      <span class="map-pin" style="background:${DAY_COLORS[s.day - 1]}">${s.day}</span>
      <span style="min-width:0"><b>${h(s.plan)}</b><br><span class="muted" style="font-size:12px">${h(s.label)} · ${h(s.time)}</span></span>
      <span class="muted" style="font-size:12px">Show ↗</span></button>`).join("");
    $$("[data-mi]").forEach(b => b.onclick = () => { const {m} = mapMarkers[+b.dataset.mi]; leafletMap.setView(m.getLatLng(), 15); m.openPopup(); $("#map").scrollIntoView({behavior: "smooth", block: "center"}); });
    if (fit) this.fit(false);
  },
  update() {},
};

          <span class="n">${counts[i].length}</span></button>`).join("")}
        <div class="spread"><span class="muted" style="font-size:12px">Called by ${h(crewBy(p.by)?.name || "the organizer")}</span>
          ${canAdmin ? `<span class="row"><button class="link" type="button" data-close-poll="${h(p.id)}">${p.closed ? "Reopen" : "Close vote"}</button><button class="link" type="button" data-rm-poll="${h(p.id)}" style="color:var(--coral)">Delete</button></span>` : ""}</div>
      </article>`;
    }).join("") : `<div class="empty">No votes open yet. Call one below: where to eat, which bar, ATV or zipline.</div>`;
    $$("[data-vote]").forEach(b => b.onclick = () => { if (!needMe()) return;
      act(Store.put("votes", b.dataset.vote + "__" + ME, {poll: b.dataset.vote, crew: ME, choice: +b.dataset.i, at: Date.now()})); });
    $$("[data-close-poll]").forEach(b => b.onclick = () => { const p = D.polls.find(x => x.id === b.dataset.closePoll); act(Store.put("polls", p.id, {...stripId(p), closed: !p.closed})); });
    $$("[data-rm-poll]").forEach(b => b.onclick = () => confirmBox("Delete this poll and its votes?", async () => {
      for (const v of D.votes.filter(v => v.poll === b.dataset.rmPoll)) await Store.del("votes", v.id);
      await Store.del("polls", b.dataset.rmPoll);
    }));
  },
};
const stripId = o => { const {id, ...rest} = o; return rest; };

/* ---------- THE LEADERBOARD ---------- */
VIEWS.leaderboard = {
  shell() {
    const judge = ME === "umang" || Store.owner;
    return `<section class="view">
      <div class="head"><div class="eyebrow"><span lang="tr">Puan tablosu</span> · Standings</div><h2>The Leaderboard</h2>
      <p>Points from challenges and the groom's decrees. Awards unseal at 6:00 AM on Sun Nov 22, Istanbul time.</p></div>
      <div class="lb" id="lb"></div>
      <div class="stack"><h3>Final awards</h3><div class="grid g3" id="awards"></div><div id="reveal"></div></div>
      <div class="grid g2">
        <div class="panel stack"><h3>Punishment menu</h3><p class="muted" style="font-size:14px">Last place at the end of the mission draws one.</p>
          <ol class="plain">${PUNISHMENTS.map(p => `<li>${h(p)}</li>`).join("")}</ol><div id="punish"></div></div>
        ${judge ? `<form class="panel stack" id="decree-form"><h3>Groom's decree</h3>
          <p class="muted" style="font-size:14px">Bonus or penalty points, with a reason the crew can see.</p>
          <div class="grid g2"><label class="f">Agent<select id="dc-who">${CREW.map(c => `<option value="${c.key}">${h(c.name)}</option>`).join("")}</select></label>
          <label class="f">Points (+ or −)<input type="number" id="dc-pts" value="10" step="5" min="-100" max="100"></label></div>
          <label class="f">Reason<input type="text" id="dc-why" maxlength="120" placeholder="Carried the cooler up Kartepe" required></label>
          <div><button class="btn primary" type="submit">Issue decree</button></div></form>` : `<div class="panel stack" id="decrees-only"><h3>Groom's decrees</h3><div id="decrees"></div></div>`}
      </div>
      ${judge ? `<div class="panel stack"><h3>Decree log</h3><div id="decrees"></div></div>` : ""}
    </section>`;
  },
  mount() {
    const f = $("#decree-form"); if (!f) return;
    f.onsubmit = e => { e.preventDefault();
      const pts = parseInt($("#dc-pts").value, 10), why = $("#dc-why").value.trim();
      if (!pts || !why) { toast("Add points and a reason."); return; }
      act(Store.put("adjust", uid(), {crew: $("#dc-who").value, pts, why, by: ME || "", at: Date.now()}), "Decree issued").then(ok => { if (ok) $("#dc-why").value = ""; }); };
  },
  update() {
    const sc = scores(); const top = Math.max(1, sc[0]?.total || 0);
    const allZero = sc.every(r => r.total === 0);
    $("#lb").innerHTML = sc.map((r, i) => `<div class="lb-row ${!allZero && i === 0 ? "first" : ""} ${!allZero && i === sc.length - 1 ? "last" : ""}">
      <div class="rank">${i + 1}</div>${avatar(r.key)}
      <div style="min-width:0"><b>${h(crewBy(r.key).name)}</b>${(D.crew.find(x => x.id === r.key) || {}).nick ? ` <span class="nick">“${h(D.crew.find(x => x.id === r.key).nick)}”</span>` : ""}
        <div class="bar-track"><i style="width:${Math.max(0, r.total) / top * 100}%"></i></div>
        <div class="breakdown">${r.ch} challenges · ${r.bonus >= 0 ? "+" : ""}${r.bonus} decrees</div></div>
      <div class="pts" style="font-size:28px">${r.total}</div></div>`).join("");
    const open = awardsOpen();
    const by = (f) => { const best = [...sc].sort((a, b) => f(b) - f(a))[0]; return best && f(best) > 0 ? crewBy(best.key).name : "No one yet"; };
    const awards = [
      ["Sultan of the Bosphorus", "Most points overall", by(r => r.total)],
      ["Dare Devil", "Most challenges completed", by(r => r.chCount)],
      ["Voice of the People", "Most votes cast", by(r => r.votes)],
      ["The Anchor", "Last place. See punishment menu", allZero ? "No one yet" : crewBy(sc[sc.length - 1].key).name],
    ];
    $("#awards").innerHTML = awards.map(([t, d, w]) => `<div class="award ${open ? "" : "locked"}"><i class="medal"></i><b>${h(t)}</b><span class="muted" style="font-size:13px">${h(d)}</span>
      <span class="mono" style="font-size:14px">${open ? h(w) : "Sealed"}</span></div>`).join("");
    $("#reveal").innerHTML = !open && (Store.owner || Store.mode === "local") ? `<button class="btn small" type="button" id="reveal-btn">Unseal awards now</button>` : "";
    const rb = $("#reveal-btn"); if (rb) rb.onclick = () => confirmBox("Unseal the awards for everyone now?", () => Store.put("settings", "main", {...stripId(settings()), reveal: true}));
    const st = settings();
    $("#punish").innerHTML = st.punishment != null && PUNISHMENTS[st.punishment] ? `<div class="banner warn" style="margin:0"><b>Drawn:</b> ${h(PUNISHMENTS[st.punishment])}</div>`
      : open ? `<button class="btn small" type="button" id="draw">Draw the punishment</button>` : `<span class="muted" style="font-size:13px">Draw unlocks with the awards.</span>`;
    const dr = $("#draw"); if (dr) dr.onclick = () => act(Store.put("settings", "main", {...stripId(st), punishment: Math.floor(Math.random() * PUNISHMENTS.length)}), "Punishment drawn");
    const dec = [...D.adjust].sort((a, b) => b.at - a.at);
    const el = $("#decrees"); if (el) el.innerHTML = dec.length ? `<div class="tbl"><table><tbody>${dec.map(a => `<tr><td>${h(crewBy(a.crew)?.name || "")}</td><td class="mono" style="color:${a.pts >= 0 ? "var(--ok)" : "var(--coral)"}">${a.pts >= 0 ? "+" : ""}${a.pts}</td><td>${h(a.why)}</td>${ME === "umang" || Store.owner ? `<td><button class="link" type="button" data-rmd="${h(a.id)}" style="color:var(--coral)">Remove</button></td>` : ""}</tr>`).join("")}</tbody></table></div>` : `<p class="muted">No decrees yet.</p>`;
    $$("[data-rmd]").forEach(b => b.onclick = () => confirmBox("Remove this decree?", () => Store.del("adjust", b.dataset.rmd)));
  },
};

/* ============================================================
   ROUTER
   ============================================================ */
let current = null, raf = 0;
function route(force = false) {
  const k = (location.hash || "").slice(1);
  const HIDDEN = ["challenges", "vault", "leaderboard"]; // hidden for now; remove from this list to bring it back
  const name = VIEWS[k] && !HIDDEN.includes(k) ? k : "mission";
  if (name === current && !force) return;
  current = name;
  const cur = key => key === name ? `aria-current="page"` : "";
  $("#tabs").innerHTML = ORDER.map(([key, label]) => `<a href="#${key}" ${cur(key)}>${label}</a>`).join("");
  $("#bnav").innerHTML = ORDER.map(([key, , short, icon]) => `<a href="#${key}" ${cur(key)}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[icon]}</svg>${short}</a>`).join("");
  $("#hero-slot").innerHTML = VIEWS[name].hero ? VIEWS[name].hero() : "";
  $("#view").innerHTML = VIEWS[name].shell();
  VIEWS[name].mount && VIEWS[name].mount();
  VIEWS[name].update();
}
function changed() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => { if (current) { VIEWS[current].update(); } paintStatus(); });
}
window.addEventListener("hashchange", () => { route(); scrollTo({top: 0}); });
$("#me-chip").onclick = pickMe;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-eye]"); if (!b) return;
  const i = document.getElementById(b.dataset.eye); if (!i) return;
  const show = i.type === "password"; i.type = show ? "text" : "password"; b.textContent = show ? "Hide" : "Show";
});

paintStatus();
route();
Store.init().then(ok => { if (ok) route(true); });
</script>
</body>
