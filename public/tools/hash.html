<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Password Hash Maker</title>
<style>
:root{--bg:#eef2f8;--panel:#fff;--line:#d4dbe8;--ink:#111a2c;--muted:#56627a;--turq:#0d7d72;--on:#fff;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0b1220;--panel:#121b2e;--line:#26324d;--ink:#e8ecf4;--muted:#93a0b8;--turq:#35b9ab;--on:#06110f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto;display:grid;gap:16px}
h1{margin:0;font-size:26px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px}
label{display:grid;gap:6px;font-weight:600;font-size:13px;color:var(--muted)}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:90px;word-break:break-all}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;background:var(--turq);color:var(--on);cursor:pointer}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
p{margin:0}.muted{color:var(--muted);font-size:14px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Password hash maker</h1>
  <p class="muted">Turns a password into a <code>passwordHash</code> for <code>crew.json</code>. Runs entirely on this phone; the password is never sent anywhere.</p>
  <form class="panel" id="f">
    <label>Password<input type="text" id="pw" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
    <div><button type="submit" id="go">Make hash</button></div>
  </form>
  <div class="panel" id="out" hidden>
    <label>passwordHash (paste between the quotes in crew.json)<textarea id="hash" readonly></textarea></label>
    <div><button type="button" class="secondary" id="copy">Copy</button></div>
    <p class="muted">Then on GitHub: open <code>crew.json</code> → pencil icon → paste → Commit changes. Vercel updates the site in about 30 seconds.</p>
  </div>
</main>
<script>
const ITER = 210000;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function hash(pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt, iterations: ITER}, key, 256);
  return `pbkdf2$sha256$${ITER}$${b64(salt)}$${b64(bits)}`;
}
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  if (!pw) return;
  const go = document.getElementById("go"); go.disabled = true; go.textContent = "Working…";
  document.getElementById("hash").value = await hash(pw);
  document.getElementById("out").hidden = false; go.disabled = false; go.textContent = "Make hash";
};
document.getElementById("copy").onclick = async () => {
  const t = document.getElementById("hash");
  try { await navigator.clipboard.writeText(t.value); document.getElementById("copy").textContent = "Copied"; }
  catch { t.select(); }
};
</script>
</body>
</html>
